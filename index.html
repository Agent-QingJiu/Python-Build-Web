<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python 云端智能打包中心</title><style>*{box-sizing:border-box}body{font:15px/1.6 system-ui;background:#0e1625;color:#edf3ff;margin:0;padding:32px 14px}.wrap{max-width:850px;margin:auto;background:#1b293e;padding:28px;border-radius:20px}h1{margin:0 0 4px}p,.hint{color:#aebdd3}label{display:block;margin-top:14px;font-weight:600}input:not([type=checkbox]),select,textarea{width:100%;background:#293b56;color:#fff;border:1px solid #526987;border-radius:9px;padding:11px;margin-top:5px}input[type=checkbox]{margin-right:8px}button{background:#377ce0;color:#fff;border:0;border-radius:9px;padding:11px 18px;cursor:pointer;margin-top:17px}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}@media(max-width:620px){.grid{grid-template-columns:1fr}}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0e192a;padding:15px;border-radius:10px;min-height:60px}a{color:#9bc7ff}.warning{color:#ffcc78}small{display:block;color:#aebdd3}.actions{display:flex;gap:10px;flex-wrap:wrap} .progress{margin-top:20px;background:#0e192a;border-radius:12px;padding:15px}.track{height:15px;background:#35455d;border-radius:999px;overflow:hidden}.fill{height:100%;width:0%;background:linear-gradient(90deg,#3378d9,#55c3e8);transition:width .35s}.progress small{margin-top:8px} </style></head><body><main class="wrap"><h1>Python 云端智能打包中心</h1><p>单文件 PY / 完整 ZIP 项目 → GitHub Actions Windows 构建 → EXE 下载</p><label>GitHub Fine-grained Token<input id="token" type="password" autocomplete="off" placeholder="仅在本页内存中使用，刷新即清空"></label><small>需要 Python-Build-Core 的 Contents（读写）及 Actions（读写）权限。请勿将 Token 发给任何人。</small><div class="grid"><label>源码类型<select id="kind"><option value="py">单个 .py</option><option value="zip">完整项目 .zip</option></select></label><label>软件名称<input id="name" value="MyApp" maxlength="60"></label></div><label>上传源码<input id="source" type="file" accept=".py"></label><label>ZIP 项目入口（多 PY 项目填写，如 src/main.py）<input id="entry" placeholder="留空则尝试自动识别"></label><div class="grid"><label>Python 版本<select id="python"><option>3.11</option><option>3.12</option><option>3.13</option><option>3.14</option></select></label><label>打包模式<select id="mode"><option value="onedir">目录模式（推荐）</option><option value="onefile">单文件 EXE</option></select></label></div><label><input id="windowed" type="checkbox" checked>GUI 无控制台黑框</label><label><input id="auto" type="checkbox" checked>识别常见第三方依赖并自动安装（其余请手填）</label><label>额外 pip 依赖（每行一个，或逗号分隔）<textarea id="packages" rows="3" placeholder="PySide6&#10;requests"></textarea></label><label>隐藏导入模块（每行一个，可选）<textarea id="hidden" rows="2" placeholder="package.submodule"></textarea></label><label>ICO 图标（可选）<input id="icon" type="file" accept=".ico"></label><p class="hint">ZIP 内的资源文件和文件夹将按目录保留。单文件模式：预估超过 512MB 提醒，超过 1024MB 禁止；实际输出仍由构建端复核。单个上传文件最大 25MB。</p><div class="actions"><button id="build">上传并开始构建</button><button id="refresh">刷新构建状态</button></div><div class="progress"><strong id="phase">等待任务</strong><div class="track" role="progressbar" aria-label="任务进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="fill" id="fill"></div></div><small id="percent">0% · 未开始</small></div><h3>任务状态</h3><pre id="status">尚未提交任务</pre><div id="links"></div></main><script src="app.js"></script></body></html>
