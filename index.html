<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python 云端智能打包中心</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#17223a;--line:#344561;--muted:#a8b8d2;--accent:#5b92ff}*{box-sizing:border-box}body{font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at 20% 0%,#20355a 0%,transparent 45%),var(--bg);color:#f3f6ff;margin:0;padding:48px 20px;min-height:100vh}.wrap{max-width:950px;margin:auto;background:linear-gradient(145deg,#1c2a44,#151f33);border:1px solid #35445f;padding:36px 42px;border-radius:24px;box-shadow:0 25px 85px #0006}h1{font-size:30px;letter-spacing:-.7px;margin:0 0 8px}h3{font-size:16px;margin:24px 0 10px}p,.hint,small{color:var(--muted)}p{margin:0 0 18px}label{display:block;margin-top:18px;font-weight:600;font-size:13px;color:#dce6f7}input:not([type=checkbox]),select,textarea{width:100%;background:#101a2d;color:#f6f9ff;border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin-top:7px;font:inherit;outline:none;transition:border-color .2s,box-shadow .2s}input:focus,select:focus,textarea:focus{border-color:#71a3ff;box-shadow:0 0 0 3px #4c87ff33}input[type=file]{cursor:pointer}input[type=checkbox]{accent-color:#6d9dff;margin-right:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}.actions{display:flex;gap:12px;flex-wrap:wrap}button{background:linear-gradient(120deg,#447df1,#6b94fa);color:#fff;font-weight:650;border:0;border-radius:11px;padding:12px 19px;cursor:pointer;margin-top:20px;box-shadow:0 6px 20px #2153a733;transition:transform .15s,filter .15s}button:hover{filter:brightness(1.12);transform:translateY(-1px)}button:disabled{opacity:.5;cursor:wait}button#refresh{background:#2d3e5b;box-shadow:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d172a;border:1px solid #30415c;padding:18px;border-radius:12px;min-height:60px;font:13px/1.7 ui-monospace,Consolas,monospace}a{color:#9dc4ff}.hint{background:#12233c;padding:13px 15px;border-left:3px solid #648ef1;border-radius:7px;margin-top:22px}.progress{margin-top:24px;background:#111d32;border:1px solid #30405c;border-radius:14px;padding:20px}.track{height:13px;background:#33415b;border-radius:999px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0%;background:linear-gradient(90deg,#3b76ed,#5ac9d9);transition:width .65s ease}.progress small{display:block;margin-top:9px}#links{margin-top:15px}#links a{display:inline-block;margin:10px 12px 0 0}@media(max-width:680px){body{padding:15px 10px}.wrap{padding:23px 18px}.grid{grid-template-columns:1fr}h1{font-size:24px}}
.token-settings{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px}.token-settings label{margin:0}.token-settings button{margin:0;background:#344663;box-shadow:none;padding:8px 12px;font-size:12px}.token-settings small{width:100%}</style></head><body><main class="wrap"><h1>Python 云端智能打包中心</h1><p>单文件 PY / 完整 ZIP 项目 → GitHub Actions Windows 构建 → EXE 下载</p><label>GitHub Fine-grained Token<input id="token" type="password" autocomplete="off" placeholder="仅在本页内存中使用，刷新即清空"></label><small>需要 Python-Build-Core 的 Contents（读写）及 Actions（读写）权限。请勿将 Token 发给任何人。</small><div class="token-settings"><label><input id="rememberToken" type="checkbox" checked>记住 Token（仅保存在本机浏览器）</label><button id="clearToken" type="button">清除已保存的 Token</button><small id="tokenStatus" aria-live="polite"></small></div><div class="grid"><label>源码类型<select id="kind"><option value="py">单个 .py</option><option value="zip">完整项目 .zip</option></select></label><label>软件名称<input id="name" value="MyApp" maxlength="60"></label></div><label>上传源码<input id="source" type="file" accept=".py"></label><label>ZIP 项目入口（多 PY 项目填写，如 src/main.py）<input id="entry" placeholder="留空则尝试自动识别"></label><div class="grid"><label>Python 版本<select id="python"><option>3.11</option><option>3.12</option><option>3.13</option><option>3.14</option></select></label><label>打包模式<select id="mode"><option value="auto">智能推荐模式</option><option value="onedir">目录模式（推荐）</option><option value="onefile">单文件 EXE</option></select></label></div><label><input id="windowed" type="checkbox" checked>GUI 无控制台黑框</label><label><input id="auto" type="checkbox" checked>识别常见第三方依赖并自动安装（其余请手填）</label><label>额外 pip 依赖（每行一个，或逗号分隔）<textarea id="packages" rows="3" placeholder="PySide6&#10;requests"></textarea></label><label><input id="smoke" type="checkbox" checked>打包后自动验收（GUI 仅检查文件，控制台程序尝试启动）</label><label>隐藏导入模块（每行一个，可选）<textarea id="hidden" rows="2" placeholder="package.submodule"></textarea></label><label>ICO 图标（可选）<input id="icon" type="file" accept=".ico"></label><p class="hint">ZIP 内的资源文件和文件夹将按目录保留。单文件模式：预估超过 512MB 提醒，超过 1024MB 禁止；实际输出仍由构建端复核。单个上传文件最大 25MB。</p><div class="actions"><button id="build">上传并开始构建</button><button id="refresh">刷新构建状态</button></div><div class="progress"><strong id="phase">等待任务</strong><div class="track" role="progressbar" aria-label="任务进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="fill" id="fill"></div></div><small id="percent">0% · 未开始</small></div><h3>任务状态</h3><pre id="status">尚未提交任务</pre><div id="links"></div></main><script src="app.js?v=20261112-5"></script></body></html>
