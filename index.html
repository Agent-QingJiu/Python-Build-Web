<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python 云端打包中心</title><style>body{font:16px system-ui;background:#101827;color:#f2f5fa;max-width:800px;margin:40px auto;padding:16px}section{background:#1d293a;padding:22px;border-radius:16px}label{display:block;margin:12px 0}input,select,textarea,button{box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #667;background:#29384e;color:white;max-width:100%}input[type=text],input[type=password],textarea{width:100%}button{background:#3379db;cursor:pointer}pre{white-space:pre-wrap}a{color:#9bc6ff}</style><section><h1>Python 云端智能打包中心</h1><p>支持单个 .py 与完整项目 .zip；通过私有 GitHub Actions 构建 Windows EXE。</p><label>GitHub Token（仅保留在当前页面内存，不保存）<input id="token" type="password"></label><label>源码类型 <select id="kind"><option value="py">单个 PY 文件</option><option value="zip">项目 ZIP</option></select></label><label>选择源码 <input id="source" type="file" accept=".py"></label><label>软件名称 <input id="name" type="text" value="MyApp"></label><label>项目入口（ZIP 模式填写，如 main.py）<input id="entry" type="text" placeholder="main.py"></label><label>Python 版本 <select id="python"><option>3.11</option><option>3.12</option><option>3.13</option><option>3.14</option></select></label><label>打包模式 <select id="mode"><option value="onedir">目录模式</option><option value="onefile">单文件 EXE</option></select></label><label><input id="windowed" type="checkbox" checked> GUI 无黑框</label><label>附加依赖（逗号分隔）<textarea id="packages"></textarea></label><label>ICO 图标（可选）<input id="icon" type="file" accept=".ico"></label><button id="build">上传并开始构建</button> <button id="refresh">查询状态</button><pre id="status"></pre><div id="links"></div></section><script src="app.js"></script></html>
